[package]
name = "module-local-minecraft"
version = "0.1.0"
edition = "2024"
description = "Rawtoh module: drives a Minecraft Java server over RCON (summon, give, effects, chat)"
license = "UNLICENSED"

[dependencies]
# Private repo, fetched over SSH (see .cargo/config.toml).
rawtoh-module-sdk = { git = "ssh://git@github.com/rawtoh-io/module-sdk-rust.git", branch = "main" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
env_logger = "0.11.11"
log = "0.4.34"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
